<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>À table</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="À table">
<meta name="theme-color" content="#f5f7f1">
<link rel="apple-touch-icon" href="icon.png?v=2">
<link rel="icon" href="icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* À table — plan de repas sportifs : une colonne, onglets en bas, fiches en feuille plein écran */
:root{
  --bg:#f5f7f1; --surface:#ffffff; --sunk:#ebf0e5; --ink:#1f2a22; --muted:#5f6b60; --line:#dde4d6;
  --herb:#2e6a4a; --herb-ink:#ffffff; --saffron:#d9932a; --tomato:#c4473a; --sea:#2f6f98; --yolk:#b98a12;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#1a221c; --sunk:#222c24; --ink:#e8eee5; --muted:#9aa89c; --line:#2c372e;
  --herb:#6dbd8c; --herb-ink:#0f1a13; --saffron:#f0b45a; --tomato:#ec7a6c; --sea:#7cb6dc; --yolk:#e3c15a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#1a221c; --sunk:#222c24; --ink:#e8eee5; --muted:#9aa89c; --line:#2c372e;
  --herb:#6dbd8c; --herb-ink:#0f1a13; --saffron:#f0b45a; --tomato:#ec7a6c; --sea:#7cb6dc; --yolk:#e3c15a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1.12}
h2{font-size:1.3rem}
h3{font-size:1.06rem;line-height:1.25}
p{margin:0}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--herb);outline-offset:2px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 16px}
section.view{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:600;font-size:.94rem}
.btn.primary{background:var(--herb);color:var(--herb-ink);border-color:var(--herb)}
.btn.block{width:100%;padding:14px 18px;font-size:1rem}
.btn.small{padding:6px 12px;font-size:.84rem}
.btn:disabled{opacity:.45}
.linkbtn{border:0;background:none;color:var(--herb);font-weight:600;padding:4px 0}

/* jauge du jour */
.kcal{display:flex;align-items:baseline;gap:6px}
.kcal b{font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.bar .lab{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:5px}
.bar .lab span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;transition:width .3s}
.cP{background:var(--sea)} .cG{background:var(--saffron)} .cL{background:var(--tomato)} .cK{background:var(--herb)}

/* repas */
.meals{display:flex;flex-direction:column;gap:10px}
.meal{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.meal.done{opacity:.62}
.emo{width:54px;height:54px;flex:none;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-size:1.75rem;line-height:1}
button.emo{border:0;padding:0;cursor:pointer}
.emo.lg{width:84px;height:84px;font-size:2.8rem;border-radius:18px}
.meal .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meal .slotlbl{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meal .title{font-weight:600;line-height:1.25}
.meal .sub{font-size:.82rem;color:var(--muted)}
.check{width:32px;height:32px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent}
.check[aria-pressed="true"]{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.check svg{width:16px;height:16px;stroke-width:2.6}

.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.stat3 b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.stat3 small{color:var(--muted);font-size:.74rem}
.warn{background:color-mix(in srgb,var(--saffron) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--saffron) 45%,var(--line));border-radius:12px;padding:12px 14px;font-size:.92rem}
.ok{color:var(--herb);font-weight:600}
.over{color:var(--tomato);font-weight:600}

/* semaine */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day.today{border-color:var(--herb);box-shadow:0 0 0 1px var(--herb)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px;background:var(--sunk);gap:8px}
.day .dh b{font-weight:700}
.day .dh span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dslot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.dslot:first-of-type{border-top:0}
.dslot .e{font-size:1.3rem;width:28px;text-align:center;flex:none}
.dslot .t{flex:1;min-width:0}
.dslot .t small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dslot .t span{font-weight:500;font-size:.95rem}
.dslot .p{flex:none;font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* liste */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.lrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.lrow:last-child{border-bottom:0}
.lrow .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lrow .title{font-weight:600}
.lrow .sub{font-size:.82rem;color:var(--muted)}
.lrow .end{flex:none;text-align:right;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lrow .emo{width:44px;height:44px;font-size:1.4rem;border-radius:10px}

.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 10px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}

.shopgroup h3{margin:4px 0 6px}
.sitem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sitem:last-child{border-bottom:0}
.sitem input{width:22px;height:22px;accent-color:var(--herb);flex:none}
.sitem label{flex:1;min-width:0;display:flex;flex-direction:column}
.sitem label small{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.sitem .pr{flex:none;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sitem.done label span{text-decoration:line-through;color:var(--muted)}

.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow span:last-child{color:var(--muted);text-align:right}
.prow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .n{flex:1;min-width:0;font-size:.94rem}
.prow .n small{display:block;color:var(--muted);font-size:.76rem}
.prow input{width:76px;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums}
.prow .u{width:32px;font-size:.8rem;color:var(--muted)}
.prow.edited input{border-color:var(--herb)}

/* feuille recette */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .wrap{padding-top:calc(4px + env(safe-area-inset-top,0px))}
.sheethead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding-block:10px;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.hero{display:flex;gap:14px;align-items:center}
.macgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macgrid div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.macgrid b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.macgrid small{font-size:.72rem;color:var(--muted)}
.ing{display:flex;flex-direction:column}
.ing div{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ing .q{width:92px;flex:none;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.steps li.done{opacity:.5}
.steps li.done::before{content:"✓";background:var(--herb);color:var(--herb-ink)}

/* questionnaire */
.ob{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto}
.ob .wrap{min-height:100%;display:flex;flex-direction:column;gap:20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.obtop{display:flex;align-items:center;gap:12px;padding-top:8px}
.prog{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--herb);transition:width .3s}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;text-align:left;width:100%}
.opt .emo{width:46px;height:46px;font-size:1.5rem}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:.86rem}
.opt[aria-pressed="true"]{border-color:var(--herb);box-shadow:0 0 0 1px var(--herb);background:color-mix(in srgb,var(--herb) 7%,var(--surface))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .opt{justify-content:center;text-align:center;padding:16px 8px}
.lbl{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
.big{font-family:var(--display);font-size:3rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px}
.stepper button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.6rem;font-weight:600}
input[type=range]{width:100%;accent-color:var(--herb)}
.obfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.ticks{display:flex;flex-direction:column;gap:12px}
.ticks div{display:flex;gap:10px;align-items:center;opacity:.25;transition:opacity .3s}
.ticks div.on{opacity:1}
.ticks i{width:26px;height:26px;border-radius:50%;background:var(--herb);color:var(--herb-ink);display:grid;place-items:center;font-style:normal;font-size:.85rem;font-weight:700}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--herb)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.meal,.lrow,.opt{transition:transform .12s}.meal:active,.lrow:active,.opt:active{transform:scale(.985)}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<nav class="tabs" id="tabs" hidden><div>
  <button data-tab="jour"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui</button>
  <button data-tab="semaine"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semaine</button>
  <button data-tab="courses"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1.2"/><circle cx="17" cy="20.5" r="1.2"/></svg>Courses</button>
  <button data-tab="recettes"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6"/></svg>Recettes</button>
  <button data-tab="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil</button>
</div></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="ob" class="ob" hidden></div>

/* ---------- Calcul des besoins ---------- */
function targets(p=S.profile){
  if(!p) return {kcal:2200,P:140,G:250,L:65};
  const bmr=10*p.poids+6.25*p.taille-5*p.age+(p.sexe==="h"?5:-161);
  const tdee=bmr*(JOBS[p.job][2]+0.04*p.seances);
  const kcal=Math.round(tdee*({perte:.8,muscle:1.1,maintien:1}[p.goal])/10)*10;
  const P=Math.round(p.poids*({perte:2,muscle:1.8,maintien:1.6}[p.goal]));
  const L=Math.round(kcal*.27/9);
  const G=Math.max(0,Math.round((kcal-P*4-L*9)/4));
  return {kcal,P,G,L,bmr:Math.round(bmr),tdee:Math.round(tdee)};
}
function slotsList(){return S.profile&&S.profile.repas===4?["pdj","dej","col","din"]:["pdj","dej","din"]}
function share(slot){
  const four=S.profile&&S.profile.repas===4;
  return four?{pdj:.22,dej:.31,col:.16,din:.31}[slot]:({pdj:.25,dej:.375,din:.375,col:.16}[slot]);
}

/* ---------- Prix ---------- */
function storeId(){return (S.profile&&S.profile.store)||"carrefour"}
function price(id){
  const st=storeId(), ov=S.prices[st];
  if(ov&&ov[id]!=null) return ov[id];
  const op=S.op[id];
  if(op){ if(op.store===st) return op.v; if(!op.store) return op.v*STORES[st][1]; }
  return ing(id).eur*STORES[st][1];
}
function priceSource(id){
  const st=storeId();
  if(S.prices[st]&&S.prices[st][id]!=null) return "ton prix";
  const op=S.op[id];
  if(op&&(op.store===st||!op.store)) return "Open Prices · "+op.n+" relevés";
  return "estimation";
}

/* ---------- Mise à l'échelle d'une recette ---------- */
function totals(items){
  let k=0,p=0,g=0,l=0,c=0;
  for(const it of items){const x=ing(it.i),f=it.g/100;k+=x.k*f;p+=x.p*f;g+=x.g*f;l+=x.l*f;c+=price(it.i)*it.g/1000}
  return {k,p,g,l,c};
}
const cache=new Map();
function scaled(rid,slot){
  const t=targets(), Kt=t.kcal*share(slot), Pt=t.P*share(slot);
  const key=rid+"|"+slot+"|"+Kt+"|"+Pt+"|"+storeId()+"|"+JSON.stringify(S.prices[storeId()]||{})+"|"+Object.keys(S.op).length;
  if(cache.has(key)) return cache.get(key);
  const r=RECMAP[rid];
  const grp={p:{k:0,p:0},c:{k:0,p:0},x:{k:0,p:0}};
  for(const it of r.items){const x=ing(it.i),f=it.g/100;grp[it.role].k+=x.k*f;grp[it.role].p+=x.p*f}
  const Kb=grp.p.k+grp.c.k+grp.x.k;
  const m=Math.min(2.6,Math.max(.5,Kt/Kb));
  let a=m,b=m;
  const det=grp.p.p*grp.c.k-grp.c.p*grp.p.k;
  if(Math.abs(det)>1e-6){
    const r1=Pt-m*grp.x.p, r2=Kt-m*grp.x.k;
    a=(r1*grp.c.k-grp.c.p*r2)/det;
    b=(grp.p.p*r2-r1*grp.p.k)/det;
  }
  a=Math.min(m*1.8,Math.max(m*.6,a)); b=Math.min(m*1.6,Math.max(m*.5,b));
  let items=r.items.map(it=>({i:it.i,g:it.g*(it.role==="p"?a:it.role==="c"?b:m)}));
  const f=Kt/totals(items).k; items.forEach(it=>it.g*=f);
  items=items.map(it=>{const x=ing(it.i);let g=it.g;
    if(x.round){const n=Math.max(1,Math.round(g/x.pc));return{i:it.i,g:n*x.pc,n}}
    g=g<20?Math.max(1,Math.round(g)):Math.round(g/5)*5; return{i:it.i,g}});
  const res={items,...totals(items)};
  cache.set(key,res); return res;
}
function qtyLabel(it,forShop){
  const x=ing(it.i);
  if(x.round){const n=it.n??Math.ceil(it.g/x.pc-0.05);return n+" "+(n>1?x.many:x.one)}
  const u=x.u==="ml"?"ml":"g";
  let s;
  if(it.g>=1000) s=(Math.round(it.g/100)/10).toLocaleString("fr-FR")+(u==="ml"?" L":" kg");
  else s=fmt(forShop&&it.g>=50?Math.round(it.g/10)*10:it.g)+" "+u;
  if(x.approx&&it.g>=x.pc*.6){const n=Math.max(1,Math.round(it.g/x.pc));s+=" · ≈ "+n+" "+(n>1?x.approx[1]:x.approx[0])}
  return s;
}

function allowed(r,p=S.profile){
  const ex=new Set(p?p.exclus:[]);
  return r.items.every(it=>{const x=ing(it.i);
    if(ex.has(it.i)) return false;
    if(p&&p.diet==="vege"&&(x.diet==="viande"||x.diet==="poisson")) return false;
    if(p&&p.diet==="pesco"&&x.diet==="viande") return false;
    return true});
}
function pool(type){return REC.filter(r=>r.type===type&&allowed(r))}
function protOk(id,s){return scaled(id,s).p>=targets().P*share(s)*.8}
function weekCost(plan){let c=0;plan.days.forEach(d=>{for(const s in d) c+=scaled(d[s],s).c});return c}
function generate(seed=Date.now()%1e9){
  const rand=rng(seed), slots=slotsList(), days=[], count={};
  const maxFor=type=>{const n=pool(type).length;return type==="plat"?(n>=7?2:Math.ceil(14/Math.max(1,n))):(n>=3?3:7)};
  for(let d=0;d<7;d++){
    const day={};
    for(const s of slots){
      const type=SLOT_TYPE[s], P=pool(type);
      if(!P.length) continue;
      const prev=d>0?(s==="din"?day.dej:days[d-1].din):null;
      let cand=P.filter(r=>(count[r.id]||0)<maxFor(type)&&r.id!==prev&&!Object.values(day).includes(r.id));
      if(!cand.length) cand=P.filter(r=>r.id!==prev); if(!cand.length) cand=P;
      const rich=cand.filter(r=>protOk(r.id,s)); if(rich.length>=2) cand=rich;
      const pick=cand[Math.floor(rand()*cand.length)];
      day[s]=pick.id; count[pick.id]=(count[pick.id]||0)+1;
    }
    days.push(day);
  }
  const plan={start:iso(new Date()),seed,days};
  fitBudget(plan);
  return plan;
}
function fitBudget(plan){
  const budget=S.profile.budget;
  for(let iter=0;iter<80;iter++){
    if(weekCost(plan)<=budget) break;
    const count={};plan.days.forEach(d=>Object.values(d).forEach(id=>count[id]=(count[id]||0)+1));
    let best=null;
    plan.days.forEach((d,di)=>{for(const s in d){
      const cur=scaled(d[s],s).c, type=SLOT_TYPE[s];
      for(const r of pool(type)){
        if(r.id===d[s]||Object.values(d).includes(r.id)) continue;
        if((count[r.id]||0)>=(type==="plat"?3:4)) continue;
        if(protOk(d[s],s)&&!protOk(r.id,s)) continue;
        const gain=cur-scaled(r.id,s).c;
        if(gain>0.05&&(!best||gain>best.gain)) best={di,s,id:r.id,gain};
      }}});
    if(!best) break;
    plan.days[best.di][best.s]=best.id;
  }
}
function minCost(){let c=0;for(const s of slotsList()){let P=pool(SLOT_TYPE[s]);const rich=P.filter(r=>protOk(r.id,s));if(rich.length)P=rich;if(P.length)c+=7*Math.min(...P.map(r=>scaled(r.id,s).c))}return c}

    case"exclus":q="Des aliments à éviter ?";body=`<p class="muted">Touche ceux que tu ne veux pas voir dans tes repas.</p><div class="chipset">${EXCLUDABLE.map(i=>`<button class="chip" data-ex="${i}" aria-pressed="${d.exclus.includes(i)}">${esc(ing(i).name)}</button>`).join("")}</div>`;break;
    case"repas":q="Combien de repas par jour ?";body=`<div class="opts">${opt("repas",3,"3 repas","🍽️","Petit-déj, déjeuner, dîner")}${opt("repas",4,"3 repas + collation","🍌","Pratique autour des séances")}</div>`;break;
    case"store":q="Où fais-tu tes courses ?";body=`<div class="grid2">${Object.entries(STORES).map(([k,v])=>`<button class="opt" data-ob="store" data-v="${k}" aria-pressed="${d.store===k}"><b>${v[0]}</b></button>`).join("")}</div>`;break;
    case"budget":q="Ton budget courses par semaine";body=`<div class="big">${d.budget} €</div><input type="range" min="20" max="150" step="5" value="${d.budget}" data-budget><p class="muted" style="text-align:center">Pour toi seul, ${d.repas===4?"28":"21"} repas · ${eur(d.budget/(d.repas===4?28:21))} le repas</p>`;break;
  }
  const last=ob.i===n-1;
  $("#ob").innerHTML=`<div class="wrap"><div class="obtop">${ob.i>0||ob.edit?`<button class="iconbtn" data-obnav="back" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>`:""}<div class="prog"><i style="width:${(ob.i+1)/n*100}%"></i></div><span class="small muted num">${String(ob.i+1).padStart(2,"0")} / ${n}</span></div>
  ${ob.i===0&&!ob.edit?`<p class="eyebrow">À table · ton plan de repas sportifs</p>`:""}<h1>${q}</h1>${body}
  <div class="obfoot"><button class="btn primary block" data-obnav="next" ${obValid()?"":"disabled"}>${last?"Calculer mon plan":"Continuer"}</button></div></div>`;
}
function obFinish(){
  const d=ob.d;d.age=+d.age;d.taille=+d.taille;d.poids=+String(d.poids).replace(",",".");d.repas=+d.repas;
  S.profile=d;cache.clear();
  const t=targets();
  $("#ob").innerHTML=`<div class="wrap" style="justify-content:center"><p class="eyebrow">Calcul</p><h1>On prépare ton plan…</h1>
   <div class="ticks"><div><i>✓</i>Besoins : ${fmt(t.kcal)} kcal par jour</div><div><i>✓</i>Macros : P ${t.P} · G ${t.G} · L ${t.L} g</div><div><i>✓</i>Prix ${STORES[d.store][0]} appliqués</div><div><i>✓</i>Ta semaine de ${slotsList().length*7} repas</div></div>
   <div class="obfoot" hidden id="obgo"><button class="btn primary block" data-obnav="done">Voir ma semaine</button></div></div>`;
  S.plan=generate();S.eaten={};save();
  const ticks=[...document.querySelectorAll(".ticks div")];
  ticks.forEach((el,i)=>setTimeout(()=>el.classList.add("on"),300+i*450));
  setTimeout(()=>{const g=$("#obgo");if(g)g.hidden=false},300+ticks.length*450);
}

/* ---------- Open Prices (bêta) ---------- */
async function refreshOpenPrices(){
  const ids=Object.keys(ING).filter(id=>ing(id).off), st=storeId(), brand=STORES[st][0].toLowerCase().replace(/[^a-z]/g,"");
  toast("Recherche des prix…");
  let okN=0,missN=0,netErr=0;
  await Promise.all(ids.map(async id=>{
    try{
      const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);
      const res=await fetch("https://prices.openfoodfacts.org/api/v1/prices?category_tag="+encodeURIComponent(ing(id).off)+"&currency=EUR&order_by=-date&size=100",{signal:ctl.signal});
      clearTimeout(to);
      if(!res.ok) throw new Error(res.status);
      const data=await res.json(), items=(data.items||[]).filter(x=>x&&x.price>0&&x.price<60&&(!x.price_per||x.price_per==="KILOGRAM"));
      const fr=items.filter(x=>!x.location||!x.location.osm_address_country_code||x.location.osm_address_country_code==="FR");
      const mine=fr.filter(x=>x.location&&String(x.location.osm_brand||x.location.osm_name||"").toLowerCase().replace(/[^a-z]/g,"").includes(brand));
      const med=a=>{const v=a.map(x=>+x.price).sort((p,q)=>p-q);return v[Math.floor(v.length/2)]};
      if(mine.length>=3){S.op[id]={v:med(mine),n:mine.length,store:st};okN++}
      else if(fr.length>=3){S.op[id]={v:med(fr),n:fr.length};okN++}
      else missN++;
    }catch(e){netErr++}
  }));
  save();cache.clear();render();
  toast(netErr===ids.length?"Open Prices injoignable depuis cet appareil":okN+" prix mis à jour"+(missN?" · "+missN+" sans relevés":""));
}

/* ---------- Événements ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-open]"); if(!b) return;
  if(b.dataset.tab) return go(b.dataset.tab);
  if(b.dataset.eat){const k=b.dataset.eat;if(S.eaten[k])delete S.eaten[k];else S.eaten[k]=1;save();
    if(b.dataset.sheet) openSheet(sheetCtx.rid,sheetCtx.slot,sheetCtx.day); else render(); return}
  if(b.dataset.open) return openSheet(b.dataset.open,b.dataset.slot,b.dataset.day);
  if(b.dataset.pick){S.plan.days[sheetCtx.day][sheetCtx.slot]=b.dataset.pick;delete S.eaten[S.plan.start+"|"+sheetCtx.day+"|"+sheetCtx.slot];save();
    openSheet(b.dataset.pick,sheetCtx.slot,sheetCtx.day);toast("Repas remplacé");return}
  if(b.dataset.f){recFilter=b.dataset.f;return render()}
  if(b.dataset.scope){shopScope=b.dataset.scope;return render()}
  if(b.dataset.ex){const a=ob.d.exclus,i=a.indexOf(b.dataset.ex);if(i>=0)a.splice(i,1);else a.push(b.dataset.ex);return obRender()}
  if(b.dataset.ob){ob.d[b.dataset.ob]=b.dataset.ob==="repas"?+b.dataset.v:b.dataset.v;return obRender()}
  if(b.dataset.sea){ob.d.seances=Math.min(7,Math.max(0,ob.d.seances+ +b.dataset.sea));return obRender()}
  if(b.dataset.obnav){const nv=b.dataset.obnav;
    if(nv==="back"){if(ob.i===0){$("#ob").hidden=true;document.body.style.overflow="";ob=null;return}ob.i--;return obRender()}
    if(nv==="next"){if(!obValid())return;if(ob.i===OB_STEPS.length-1)return obFinish();ob.i++;return obRender()}
    if(nv==="done"){$("#ob").hidden=true;document.body.style.overflow="";ob=null;tab="jour";go("jour");return}}
  if(b.dataset.act){switch(b.dataset.act){
    case"close":return closeSheet();
    case"back":return openSheet(sheetCtx.rid,sheetCtx.slot,sheetCtx.day);
    case"swap":return openSwap();
    case"edit":return openOnboarding(true);
    case"regen":if(S.plan&&dayIndex()>=0&&dayIndex()<=6&&!confirm("Remplacer la semaine en cours par une nouvelle ?"))return;
      S.plan=generate();S.eaten={};save();render();toast("Nouvelle semaine générée");return;
    case"copy":{const items=shopItems();let txt="Courses "+STORES[storeId()][0]+"\n";
      for(const ry of RAYON_ORDER){const g=items.filter(x=>ing(x.i).ray===ry);if(!g.length)continue;txt+="\n"+RAYONS[ry]+"\n";g.forEach(x=>txt+="- "+ing(x.i).name+" : "+qtyLabel({i:x.i,g:x.g},true)+"\n")}
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Liste copiée"),()=>toast("Copie impossible sur cet appareil"));return}
    case"resetprices":delete S.prices[storeId()];S.op={};save();cache.clear();render();toast("Prix réinitialisés");return;
    case"openprices":return refreshOpenPrices();
  }}
});
document.addEventListener("click",e=>{const li=e.target.closest(".steps li");if(li)li.classList.toggle("done")});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.in){ob.d[t.dataset.in]=t.value;const btn=document.querySelector('[data-obnav="next"]');if(btn)btn.disabled=!obValid()}
  if(t.dataset.budget!==undefined){ob.d.budget=+t.value;document.querySelector("#ob .big").textContent=t.value+" €";
    document.querySelector("#ob .big").nextElementSibling.nextElementSibling.textContent="Pour toi seul, "+(ob.d.repas===4?28:21)+" repas · "+eur(ob.d.budget/(ob.d.repas===4?28:21))+" le repas"}
  if(t.dataset.q!==undefined){recQuery=t.value;const pos=t.selectionStart;render();const f=document.querySelector("[data-q]");f.focus();f.setSelectionRange(pos,pos)}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.shop){const k=S.plan.start;S.shop[k]=S.shop[k]||{};if(t.checked)S.shop[k][t.dataset.shop]=1;else delete S.shop[k][t.dataset.shop];save();render()}
  if(t.dataset.price){const v=parseFloat(t.value.replace(",","."));const st=storeId();S.prices[st]=S.prices[st]||{};
    if(v>0)S.prices[st][t.dataset.price]=Math.round(v*100)/100;else delete S.prices[st][t.dataset.price];save();cache.clear();render();toast("Prix enregistré")}
});

go("jour");
</script>
