<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>À table</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="À table">
<meta name="theme-color" content="#edf0f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1222" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png?v=2">
<link rel="icon" href="icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* À table — identité « maillot » : Archivo élargi pour titres et chiffres, cobalt + bleu nuit, barre d'onglets flottante */
:root{
  --bg:#edf0f5; --surface:#ffffff; --sunk:#e3e8f0; --ink:#121a33; --muted:#5d6782; --line:#d9dfea;
  --brand:#2f55f4; --brand-ink:#ffffff; --brand-deep:#1f3fd0;
  --pro:#2f55f4; --carb:#ff8a2b; --fat:#f2477e; --teal:#0f9f8c;
  --navbg:#121a33;
  --display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --body:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:20px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1222; --surface:#161d33; --sunk:#1f2842; --ink:#eef1fa; --muted:#98a2bf; --line:#263052;
  --brand:#5b7bff; --brand-ink:#ffffff; --brand-deep:#3d5ef0;
  --pro:#7d97ff; --carb:#ffa45a; --fat:#ff6f9a; --teal:#35c7b2; --navbg:#1d2643; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1222; --surface:#161d33; --sunk:#1f2842; --ink:#eef1fa; --muted:#98a2bf; --line:#263052;
  --brand:#5b7bff; --brand-ink:#ffffff; --brand-deep:#3d5ef0;
  --pro:#7d97ff; --carb:#ffa45a; --fat:#ff6f9a; --teal:#35c7b2; --navbg:#1d2643; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;font-stretch:100%}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{padding-bottom:calc(var(--tabh) + 40px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-stretch:125%;font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:1.62rem;line-height:1.08}
h2{font-size:1.08rem;line-height:1.2}
h3{font-size:.98rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.88rem;font-weight:500;color:var(--muted);margin-bottom:2px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
.fig{font-family:var(--display);font-stretch:125%;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
button,input,select,summary{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* barre du haut */
.appbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px;margin-bottom:4px}
.appbar .in{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
section.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;font-weight:600;font-size:.94rem;white-space:nowrap}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.block{width:100%;min-height:54px;font-size:1rem;border-radius:16px}
.btn.small{min-height:38px;padding:6px 12px;font-size:.86rem;border-radius:12px}
.btn:disabled{opacity:.4}
.btn svg{width:18px;height:18px}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;padding:8px 0;min-height:36px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

/* bandeau des jours */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dpill{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 8px;border-radius:14px;border:1px solid transparent;background:var(--surface);min-height:62px}
.dpill small{font-size:.72rem;font-weight:600;color:var(--muted)}
.dpill b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.dpill .dots{display:flex;gap:2px;height:4px}
.dpill .dots i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.dpill .dots i.on{background:var(--brand)}
.dpill.today{border-color:var(--brand)}
.dpill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dpill[aria-pressed="true"] small{color:inherit;opacity:.7}
.dpill[aria-pressed="true"] .dots i{background:color-mix(in srgb,var(--bg) 30%,transparent)}
.dpill[aria-pressed="true"] .dots i.on{background:#8fa6ff}

/* bloc du jour : l'élément fort */
.dayhero{background:var(--brand);color:#fff;border:0;border-radius:28px;padding:20px;position:relative;overflow:hidden}
.dayhero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.07);pointer-events:none}
.dayhero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dayhero .kc{display:flex;flex-direction:column;line-height:1}
.dayhero .kc b{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:3.4rem;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.dayhero .kc span{font-size:.92rem;opacity:.82;margin-top:6px}
.dayhero .left{text-align:right;font-size:.86rem;opacity:.9;line-height:1.3}
.dayhero .left b{display:block;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.25rem;opacity:1}
.kbar{height:10px;border-radius:5px;background:rgba(255,255,255,.2);margin:16px 0 18px;overflow:hidden}
.kbar i{display:block;height:100%;border-radius:5px;background:#fff;transition:width .5s ease}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macros div{display:flex;flex-direction:column;gap:6px}
.macros small{font-size:.8rem;opacity:.85}
.macros b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.macros b span{font-family:var(--body);font-stretch:100%;font-weight:500;font-size:.78rem;opacity:.75}
.macros .t{height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.macros .t i{display:block;height:100%;border-radius:3px}
.mP{background:#fff} .mG{background:#ffc38f} .mL{background:#ffb3cb}

/* barres (autres vues) */
.bar .lab{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px;gap:6px}
.track{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px}

/* cartes repas */
.meals{display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.meal{position:relative;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:opacity .2s}
.meal.next{border-color:var(--t);box-shadow:inset 4px 0 0 var(--t)}
.meal.done{opacity:.55}
.mopen{flex:1;min-width:0;display:flex;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:12px 4px 12px 12px}
.emo{width:58px;height:58px;flex:none;border-radius:16px;background:color-mix(in srgb,var(--t,var(--brand)) 13%,var(--surface));display:grid;place-items:center;font-size:1.85rem;line-height:1}
.s-pdj{--t:var(--carb)} .s-dej{--t:var(--brand)} .s-col{--t:var(--fat)} .s-din{--t:var(--teal)}
.mopen .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.slotlbl{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--t,var(--muted))}
.slotlbl em{font-style:normal;font-size:.72rem;font-weight:700;background:var(--t);color:#fff;border-radius:6px;padding:1px 7px}
.mopen .title{font-weight:700;line-height:1.25;font-size:1.02rem}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.check{width:48px;height:48px;margin-right:8px;flex:none;border:0;background:none;display:grid;place-items:center}
.check span{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.check[aria-pressed="true"] span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.check svg{width:16px;height:16px;stroke-width:3}
.hint{text-align:center;font-size:.8rem;color:var(--muted)}

.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;min-width:0}
.stat3 b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat3 small{color:var(--muted);font-size:.76rem}
.warn{background:color-mix(in srgb,var(--carb) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--carb) 40%,var(--line));border-radius:16px;padding:12px 14px;font-size:.9rem}
.ok{color:var(--teal)} .over{color:var(--fat)}

/* semaine */
.wk{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;min-height:66px}
.wrow:last-child{border-bottom:0}
.wrow .d{width:44px;flex:none;display:flex;flex-direction:column;line-height:1.1}
.wrow .d small{font-size:.76rem;font-weight:600;color:var(--muted)}
.wrow .d b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.wrow.today .d b{color:var(--brand)}
.wrow .e{flex:1;display:flex;gap:4px;font-size:1.3rem}
.wrow .e span{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 13%,var(--surface))}
.wrow .x{flex:none;text-align:right;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.wrow .x b{display:block;color:var(--ink);font-size:.92rem}
.chev{width:16px;height:16px;color:var(--muted);flex:none}

/* listes */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.lrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;min-height:62px}
.lrow:last-child{border-bottom:0}
.lrow .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lrow .title{font-weight:700}
.lrow .sub{font-size:.8rem;color:var(--muted)}
.lrow .end{flex:none;text-align:right;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lrow .emo{width:44px;height:44px;font-size:1.4rem;border-radius:12px}

.seg{display:flex;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 10px;min-height:38px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(18,26,51,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;min-height:40px;font-size:.9rem;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.field{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:16px}
.search .field{padding-left:42px}

/* recettes */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{display:flex;flex-direction:column;gap:6px;text-align:left;padding:8px 8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);min-width:0}
.rcard .emo{width:100%;height:96px;font-size:2.8rem;border-radius:14px;margin-bottom:4px}
.rcard .title,.rcard .meta,.rcard .pr{padding-inline:4px}
.rcard .title{font-weight:700;font-size:.94rem;line-height:1.25;min-height:2.5em}
.rcard .meta{font-size:.78rem}
.rcard .pr{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rcard .pr b{color:var(--ink);font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.95rem}
.rcard.off{opacity:.45}

/* courses */
.progress{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .3s}
details.ray{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
details.ray summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;cursor:pointer;min-height:52px}
details.ray summary::-webkit-details-marker{display:none}
details.ray summary span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
details.ray summary svg{width:16px;height:16px;transition:transform .2s}
details.ray[open] summary svg{transform:rotate(180deg)}
details.ray.complete summary h3{color:var(--muted)}
.sitem{display:flex;align-items:center;gap:12px;padding:0 14px;border-top:1px solid var(--line);min-height:58px}
.sitem input{width:24px;height:24px;accent-color:var(--brand);flex:none;margin:0}
.sitem label{flex:1;min-width:0;display:flex;flex-direction:column;padding:9px 0;cursor:pointer;font-weight:500}
.sitem label small{color:var(--muted);font-size:.8rem;font-weight:400;font-variant-numeric:tabular-nums}
.sitem .pr{flex:none;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sitem.done label span{text-decoration:line-through;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.92rem}
.switch input{width:20px;height:20px;accent-color:var(--brand)}

/* profil */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;min-height:54px;font-weight:500}
.setrow:last-child{border-bottom:0}
.setrow .v{color:var(--muted);font-weight:400;text-align:right;display:flex;align-items:center;gap:6px;min-width:0}
.setrow .v span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
details.prices summary{list-style:none;cursor:pointer}
details.prices summary::-webkit-details-marker{display:none}
.prow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .n{flex:1;min-width:0;font-size:.94rem}
.prow .n small{display:block;color:var(--muted);font-size:.76rem}
.prow input{width:80px;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;font-size:16px;font-variant-numeric:tabular-nums}
.prow .u{width:32px;font-size:.8rem;color:var(--muted)}
.prow.edited input{border-color:var(--brand)}
.macgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macgrid div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden}
.macgrid div::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--line))}
.macgrid b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.02rem;font-variant-numeric:tabular-nums}
.macgrid small{font-size:.74rem;color:var(--muted)}
.macgrid .tP{--c:var(--pro)} .macgrid .tG{--c:var(--carb)} .macgrid .tL{--c:var(--fat)} .macgrid .tK{--c:var(--ink)}

/* feuille */
.scrim{position:fixed;inset:0;z-index:29;background:rgba(13,18,34,.4);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.sheethead{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px;gap:8px}
.sheethead .grab{position:absolute;left:50%;top:calc(4px + env(safe-area-inset-top,0px));width:38px;height:5px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.hero .emo{width:100%;height:150px;font-size:4.6rem;border-radius:26px}
.hero h1{font-size:1.5rem}
.ing{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ing div{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.ing div:last-child{border-bottom:0}
.ing .q{width:84px;flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:pointer}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.9rem}
.steps li.done{opacity:.5}
.steps li.done::before{content:"✓";background:var(--ink);color:var(--bg)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:31;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.actionbar.on{transform:none}
.actionbar .wrap{display:flex;gap:10px;padding-bottom:0}
.actionbar .btn{flex:1;min-height:52px;border-radius:16px}

/* questionnaire */
.ob{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto}
.ob .wrap{min-height:100%;display:flex;flex-direction:column;gap:20px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.ob h1{font-size:1.9rem;line-height:1.05}
.obtop{display:flex;align-items:center;gap:12px;min-height:44px}
.prog{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;text-align:left;width:100%;min-height:66px}
.opt .emo{width:46px;height:46px;font-size:1.5rem;border-radius:13px;background:var(--sunk)}
.opt b{display:block;font-weight:700}
.opt small{color:var(--muted);font-size:.86rem}
.opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);background:color-mix(in srgb,var(--brand) 7%,var(--surface))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .opt{justify-content:center;text-align:center;padding:14px 8px}
.lbl{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
.big{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:3.6rem;line-height:1;text-align:center;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:center;gap:24px}
.stepper button{width:60px;height:60px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:1.6rem;font-weight:600}
input[type=range]{width:100%;accent-color:var(--brand);height:32px}
.obfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;padding-top:12px;background:linear-gradient(transparent,var(--bg) 30%)}
.ticks{display:flex;flex-direction:column;gap:14px}
.ticks div{display:flex;gap:10px;align-items:center;opacity:.2;transform:translateY(4px);transition:opacity .35s,transform .35s;font-weight:500}
.ticks div.on{opacity:1;transform:none}
.ticks i{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.85rem;font-weight:700}

/* barre d'onglets flottante */
nav.tabs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;pointer-events:none}
nav.tabs div{pointer-events:auto;display:flex;width:100%;max-width:520px;height:var(--tabh);background:var(--navbg);border-radius:24px;padding:6px;box-shadow:0 10px 30px rgba(18,26,51,.28)}
nav.tabs button{flex:1;border:0;background:none;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.66rem;font-weight:600;color:rgba(255,255,255,.62);position:relative;transition:background .2s,color .2s}
nav.tabs button .ic{display:grid;place-items:center}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{background:var(--brand);color:#fff}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--fat);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--navbg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:.9rem;font-weight:500;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.slidein{animation:slide .25s ease}
.slidein.l{animation-name:slidel}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slidel{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (prefers-reduced-motion:no-preference){.mopen:active,.lrow:active,.opt:active,.rcard:active,.wrow:active,.dpill:active{transform:scale(.98)}.mopen,.lrow,.opt,.rcard,.wrow,.dpill{transition:transform .12s}}
@media (min-width:560px){.rgrid{grid-template-columns:repeat(3,1fr)}}
</style>

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- Calcul des besoins ---------- */
function targets(p=S.profile){
  if(!p) return {kcal:2200,P:140,G:250,L:65};
  const bmr=10*p.poids+6.25*p.taille-5*p.age+(p.sexe==="h"?5:-161);
  const tdee=bmr*(JOBS[p.job][2]+0.04*p.seances);
  const kcal=Math.round(tdee*({perte:.8,muscle:1.1,maintien:1}[p.goal])/10)*10;
  const P=Math.round(p.poids*({perte:2,muscle:1.8,maintien:1.6}[p.goal]));
  const L=Math.round(kcal*.27/9);
  const G=Math.max(0,Math.round((kcal-P*4-L*9)/4));
  return {kcal,P,G,L,bmr:Math.round(bmr),tdee:Math.round(tdee)};
}
function slotsList(){return S.profile&&S.profile.repas===4?["pdj","dej","col","din"]:["pdj","dej","din"]}
function share(slot){
  const four=S.profile&&S.profile.repas===4;
  return four?{pdj:.22,dej:.31,col:.16,din:.31}[slot]:({pdj:.25,dej:.375,din:.375,col:.16}[slot]);
}

function price(id){

  if(ov&&ov[id]!=null) return ov[id];
  const op=S.op[id];
  if(op){ if(op.store===st) return op.v; if(!op.store) return op.v*STORES[st][1]; }
  return ing(id).eur*STORES[st][1];
}
function priceSource(id){

  if(S.prices[st]&&S.prices[st][id]!=null) return "ton prix";
  const op=S.op[id];
  if(op&&(op.store===st||!op.store)) return "Open Prices · "+op.n+" relevés";
  return "estimation";
}

/* ---------- Mise à l'échelle d'une recette ---------- */
function totals(items){
  let k=0,p=0,g=0,l=0,c=0;
  for(const it of items){const x=ing(it.i),f=it.g/100;k+=x.k*f;p+=x.p*f;g+=x.g*f;l+=x.l*f;c+=price(it.i)*it.g/1000}
  return {k,p,g,l,c};
}
const cache=new Map();
function scaled(rid,slot){
  const t=targets(), Kt=t.kcal*share(slot), Pt=t.P*share(slot);
  const key=rid+"|"+slot+"|"+Kt+"|"+Pt+"|"+storeId()+"|"+JSON.stringify(S.prices[storeId()]||{})+"|"+Object.keys(S.op).length;
  if(cache.has(key)) return cache.get(key);
  const r=RECMAP[rid];
  const grp={p:{k:0,p:0},c:{k:0,p:0},x:{k:0,p:0}};
  for(const it of r.items){const x=ing(it.i),f=it.g/100;grp[it.role].k+=x.k*f;grp[it.role].p+=x.p*f}
  const Kb=grp.p.k+grp.c.k+grp.x.k;
  const m=Math.min(2.6,Math.max(.5,Kt/Kb));
  let a=m,b=m;
  const det=grp.p.p*grp.c.k-grp.c.p*grp.p.k;
  if(Math.abs(det)>1e-6){
    const r1=Pt-m*grp.x.p, r2=Kt-m*grp.x.k;
    a=(r1*grp.c.k-grp.c.p*r2)/det;
    b=(grp.p.p*r2-r1*grp.p.k)/det;
  }
  const fatty=r.items.some(it=>it.role==="p"&&ing(it.i).l>ing(it.i).p*.5);
  a=Math.min(m*(fatty?1.25:1.8),Math.max(m*.6,a)); b=Math.min(m*1.6,Math.max(m*.5,b));
  let items=r.items.map(it=>({i:it.i,g:it.g*(it.role==="p"?a:it.role==="c"?b:m)}));
  const f=Kt/totals(items).k; items.forEach(it=>it.g*=f);
  items=items.map(it=>{const x=ing(it.i);let g=it.g;
    if(x.round){const n=Math.max(1,Math.round(g/x.pc));return{i:it.i,g:n*x.pc,n}}
    g=g<20?Math.max(1,Math.round(g)):Math.round(g/5)*5; return{i:it.i,g}});
  const res={items,...totals(items)};
  cache.set(key,res); return res;
}
function qtyLabel(it,forShop){
  const x=ing(it.i);
  if(x.round){const n=it.n??Math.ceil(it.g/x.pc-0.05);return n+" "+(n>1?x.many:x.one)}
  const u=x.u==="ml"?"ml":"g";
  let s;
  if(it.g>=1000) s=(Math.round(it.g/100)/10).toLocaleString("fr-FR")+(u==="ml"?" L":" kg");
  else s=fmt(forShop&&it.g>=50?Math.round(it.g/10)*10:it.g)+" "+u;
  const h=approxHint(it); if(h&&forShop) s+=" · "+h;
  return s;
}
function approxHint(it){const x=ing(it.i);if(!x.approx||it.g<x.pc*.6)return "";const n=Math.max(1,Math.round(it.g/x.pc));return "≈ "+n+" "+(n>1?x.approx[1]:x.approx[0])}

/* ---------- Génération de la semaine ---------- */
function allowed(r,p=S.profile){
  const ex=new Set(p?p.exclus:[]);
  return r.items.every(it=>{const x=ing(it.i);
    if(ex.has(it.i)) return false;
    if(p&&p.diet==="vege"&&(x.diet==="viande"||x.diet==="poisson")) return false;
    if(p&&p.diet==="pesco"&&x.diet==="viande") return false;
    return true});
}
function pool(type){return REC.filter(r=>r.type===type&&allowed(r))}
function protOk(id,s){return scaled(id,s).p>=targets().P*share(s)*.8}
function weekCost(plan){let c=0;plan.days.forEach(d=>{for(const s in d) c+=scaled(d[s],s).c});return c}
function generate(seed=Date.now()%1e9){
  const rand=rng(seed), slots=slotsList(), days=[], count={};
  const maxFor=type=>{const n=pool(type).length;return type==="plat"?(n>=7?2:Math.ceil(14/Math.max(1,n))):(n>=3?3:7)};
  for(let d=0;d<7;d++){
    const day={};
    for(const s of slots){
      const type=SLOT_TYPE[s], P=pool(type);
      if(!P.length) continue;
      const prev=d>0?(s==="din"?day.dej:days[d-1].din):null;
      let cand=P.filter(r=>(count[r.id]||0)<maxFor(type)&&r.id!==prev&&!Object.values(day).includes(r.id));
      if(!cand.length) cand=P.filter(r=>r.id!==prev); if(!cand.length) cand=P;
      const rich=cand.filter(r=>protOk(r.id,s)); if(rich.length>=2) cand=rich;
      const pick=cand[Math.floor(rand()*cand.length)];
      day[s]=pick.id; count[pick.id]=(count[pick.id]||0)+1;
    }
    days.push(day);
  }
  const plan={start:iso(new Date()),seed,days};
  fitBudget(plan);
  return plan;
}
function fitBudget(plan){
  const budget=S.profile.budget;
  for(let iter=0;iter<80;iter++){
    if(weekCost(plan)<=budget) break;
    const count={};plan.days.forEach(d=>Object.values(d).forEach(id=>count[id]=(count[id]||0)+1));
    let best=null;
    plan.days.forEach((d,di)=>{for(const s in d){
      const cur=scaled(d[s],s).c, type=SLOT_TYPE[s];
      for(const r of pool(type)){
        if(r.id===d[s]||Object.values(d).includes(r.id)) continue;
        if((count[r.id]||0)>=(type==="plat"?3:4)) continue;
        if(protOk(d[s],s)&&!protOk(r.id,s)) continue;
        const gain=cur-scaled(r.id,s).c;
        if(gain>0.05&&(!best||gain>best.gain)) best={di,s,id:r.id,gain};
      }}});
    if(!best) break;
    plan.days[best.di][best.s]=best.id;
  }
}
function minCost(){let c=0;for(const s of slotsList()){let P=pool(SLOT_TYPE[s]);const rich=P.filter(r=>protOk(r.id,s));if(rich.length)P=rich;if(P.length)c+=7*Math.min(...P.map(r=>scaled(r.id,s).c))}return c}
function dayIndex(){if(!S.plan)return -1;return Math.floor((parseISO(iso(new Date()))-parseISO(S.plan.start))/DAY)}

  if(!S.plan){app.innerHTML=h+"</section></div>";return}
  const wc=weekCost(S.plan), mc=minCost(), nMeals=7*slotsList().length;
  h+=`<div class="stat3"><div><b class="${wc<=p.budget+.5?"ok":"over"}">${eur0(wc)}</b><small>sur ${eur0(p.budget)} prévus</small></div><div><b>${eur(wc/nMeals)}</b><small>par repas</small></div><div><b>${nMeals}</b><small>repas · ${STORES[p.store][0]}</small></div></div>`;
  if(wc>p.budget+0.5) h+=`<p class="warn">Ton budget de ${eur0(p.budget)} est un peu serré : pour atteindre tes ${targets().P} g de protéines par jour, compte au moins ${eur0(mc)} par semaine chez ${STORES[p.store][0]}. Les repas les moins chers ont déjà été choisis.</p>`;
  const today=dayIndex();
  h+=`<div class="wk">`;
  S.plan.days.forEach((d,i)=>{const dt=dateOf(i);let k=0,c=0,eaten=0,n=0;
    const emos=slotsList().filter(s=>d[s]).map(s=>{const x=scaled(d[s],s);k+=x.k;c+=x.c;n++;if(S.eaten[eatKey(i,s)])eaten++;return `<span class="s-${s}" title="${esc(RECMAP[d[s]].name)}">${RECMAP[d[s]].emo}</span>`}).join("");
    h+=`<button class="wrow${i===today?" today":""}" data-goday="${i}"><span class="d"><small>${dt.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","")}</small><b>${dt.getDate()}</b></span><span class="e">${emos}</span><span class="x"><b>${eur(c)}</b>${eaten?`${eaten}/${n} mangés`:fmt(k)+" kcal"}</span>${ICON.chev}</button>`});
  h+=`</div><p class="hint">Touche un jour pour voir ses repas. Chaque repas peut être remplacé depuis sa fiche.</p></section></div>`;
  app.innerHTML=h;
}

function shopItems(){
  const di=Math.max(0,dayIndex()), from=shopScope==="reste"&&di<=6?di:0, agg={};
  if(!S.plan) return [];
  S.plan.days.forEach((d,i)=>{ if(i<from) return;
    for(const s in d){ for(const it of scaled(d[s],s).items){ agg[it.i]=(agg[it.i]||0)+it.g } } });
  return Object.entries(agg).map(([i,g])=>({i,g,c:price(i)*g/1000}));
}
function renderCourses(){
  const items=shopItems(), key=S.plan?S.plan.start:"", done=S.shop[key]||{};
  let total=0,left=0,nDone=0;
  items.forEach(x=>{total+=x.c;if(done[x.i])nDone++;else left+=x.c});
  let h=appbar(STORES[storeId()][0],"Liste de courses",`<button class="btn small" data-act="copy">${ICON.copy}Copier</button>`,
    `<div class="seg" style="margin-top:12px"><button data-scope="reste" aria-pressed="${shopScope==="reste"}">Jours restants</button><button data-scope="tout" aria-pressed="${shopScope==="tout"}">Toute la semaine</button></div>`)+`<div class="wrap"><section class="view">
    <div class="card"><div class="row2" style="margin-bottom:10px"><span><b class="num">${nDone}</b> <span class="muted">/ ${items.length} articles</span></span><span class="num"><b>${eur(left)}</b> <span class="muted small">restants</span></span></div>
    <div class="progress"><i style="width:${items.length?nDone/items.length*100:0}%"></i></div>
    <label class="switch" style="margin-top:12px"><span>Masquer les articles cochés</span><input type="checkbox" data-hide ${hideDone?"checked":""}></label></div>`;
  for(const ry of RAYON_ORDER){
    let g=items.filter(x=>ing(x.i).ray===ry).sort((a,b)=>(!!done[a.i]-!!done[b.i])||ing(a.i).name.localeCompare(ing(b.i).name));
    if(!g.length) continue;
    const gd=g.filter(x=>done[x.i]).length, tot=g.length, complete=gd===tot;
    if(hideDone) g=g.filter(x=>!done[x.i]);
    if(hideDone&&!g.length) continue;
    h+=`<details class="ray${complete?" complete":""}" ${complete?"":"open"}><summary><h3>${RAYONS[ry]}</h3><span>${gd}/${tot}${ICON.down}</span></summary>`;
    for(const x of g){const ok=!!done[x.i];
      h+=`<div class="sitem${ok?" done":""}"><input type="checkbox" id="s-${x.i}" data-shop="${x.i}" ${ok?"checked":""}><label for="s-${x.i}"><span>${esc(ing(x.i).name)}</span><small>${qtyLabel({i:x.i,g:x.g},true)}</small></label><span class="pr">${eur(x.c)}</span></div>`}
    h+=`</details>`;
  }
  if(!items.length) h+=`<p class="card muted">Rien à acheter pour l'instant.</p>`;
  h+=`<div class="card"><div class="row2"><span>Total estimé</span><b class="num">${eur(total)}</b></div>
    <p class="small muted" style="margin-top:8px">Prix au poids utilisé dans les recettes. En magasin, tu achètes des paquets entiers : le ticket sera un peu plus élevé la première semaine, puis tu écoules tes placards.</p></div></section></div>`;
  app.innerHTML=h;
}

function recList(){
  return REC.filter(r=>{
    if(recFilter==="vege"&&r.items.some(it=>ing(it.i).diet)) return false;
    if(["pdj","plat","col"].includes(recFilter)&&r.type!==recFilter) return false;
    if(recQuery&&!(r.name+" "+r.items.map(it=>ing(it.i).name).join(" ")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").includes(recQuery.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""))) return false;
    return true});
}
function recGrid(){

}

/* ---------- Feuille (fiche recette, échange, mise au menu) ---------- */
let sheetCtx=null;
function showSheet(html,actions){
  const sh=$("#sheet"), sc=$("#scrim"), ab=$("#actionbar");
  sh.innerHTML=html; sh.scrollTop=0;
  $("#actions").innerHTML=actions||""; ab.hidden=!actions;
  if(sh.hidden){
    sh.hidden=false; sc.hidden=false; document.body.style.overflow="hidden";
    history.pushState({sheet:1},"");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{sh.classList.add("on");sc.classList.add("on");if(actions)ab.classList.add("on")}));
  } else { if(actions) requestAnimationFrame(()=>ab.classList.add("on")); else ab.classList.remove("on") }
}
function hideSheet(){
  const sh=$("#sheet"), sc=$("#scrim"), ab=$("#actionbar");
  if(sh.hidden) return;
  sh.classList.remove("on"); sc.classList.remove("on"); ab.classList.remove("on");
  setTimeout(()=>{sh.hidden=true;sc.hidden=true;ab.hidden=true;document.body.style.overflow=""},300);
  sheetCtx=null; render();
}
function closeSheet(){ if(history.state&&history.state.sheet) history.back(); else hideSheet() }
const shead=(btn,label)=>`<div class="sheethead"><span class="grab"></span><button class="iconbtn" data-act="${btn}" aria-label="${btn==="back"?"Retour":"Fermer"}">${btn==="back"?ICON.back:ICON.close}</button><span class="small muted">${label||""}</span><span style="width:44px"></span></div>`;
function openSheet(rid,slot,day){
  const inPlan=day!=null&&day!==""&&S.plan; day=inPlan?+day:null;
  sheetCtx={rid,slot,day};
  const r=RECMAP[rid], x=scaled(rid,slot);
  const k=inPlan?eatKey(day,slot):null, done=k&&S.eaten[k];
  const label=inPlan?`${SLOTS[slot]} · ${dateOf(day).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric"})}`:"";
  const html=`<div class="wrap">${shead("close",label)}<section class="view s-${slot}">
    <div class="hero"><span class="emo">${r.emo}</span><div><h1>${esc(r.name)}</h1><p class="muted small" style="margin-top:4px">${r.min} min · ${eur(x.c)} la portion${allowed(r)?"":" · exclue de ton plan"}</p></div></div>
    <div class="macgrid"><div class="tK"><b>${fmt(x.k)}</b><small>kcal</small></div><div class="tP"><b>${fmt(x.p)} g</b><small>Protéines</small></div><div class="tG"><b>${fmt(x.g)} g</b><small>Glucides</small></div><div class="tL"><b>${fmt(x.l)} g</b><small>Lipides</small></div></div>
    <div class="row2"><h2>Ingrédients</h2><span class="small muted">1 portion pour toi</span></div><div class="ing">${x.items.map(it=>{const h=approxHint(it);return `<div><span class="q">${qtyLabel(it)}</span><span>${esc(ing(it.i).name)}${h?`<small class="muted" style="display:block;font-size:.8rem">${h}</small>`:""}</span></div>`}).join("")}</div>
    <h2>Préparation</h2><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    <p class="hint">Touche une étape pour la cocher</p></section></div>`;
  let actions="";
  if(inPlan) actions=`<button class="btn" data-act="swap">${ICON.swap}Changer</button><button class="btn ${done?"":"primary"}" data-eat="${k}" data-sheet="1">${done?ICON.check+"Mangé":"J'ai mangé ça"}</button>`;
  else if(planOn()&&allowed(r)) actions=`<button class="btn primary" data-act="place">${ICON.plus}Mettre au menu</button>`;
  showSheet(html,actions);
}
function openSwap(){
  const {rid,slot,day}=sheetCtx, d=S.plan.days[day];
  const alts=pool(SLOT_TYPE[slot]).filter(r=>r.id!==rid).map(r=>({r,x:scaled(r.id,slot)})).sort((a,b)=>a.x.c-b.x.c);
  let h=`<div class="wrap">${shead("back","Du moins cher au plus cher")}<section class="view"><h1>Changer le ${SLOTS[slot].toLowerCase()}</h1><div class="list">`;
  for(const {r,x} of alts){const used=Object.values(d).includes(r.id);
    h+=`<button class="lrow s-${slot}" data-pick="${r.id}"><span class="emo">${r.emo}</span><span class="main"><span class="title">${esc(r.name)}</span><span class="sub">${r.min} min · ${fmt(x.p)} g prot.${used?" · déjà au menu ce jour":""}</span></span><span class="end">${eur(x.c)}</span></button>`}
  showSheet(h+"</div></section></div>","");
}
function openPlace(){
  const r=RECMAP[sheetCtx.rid], slots=slotsList().filter(s=>SLOT_TYPE[s]===r.type), from=Math.max(0,dayIndex());
  let h=`<div class="wrap">${shead("back","Remplace un repas prévu")}<section class="view"><h1>Mettre « ${esc(r.name)} » au menu</h1><div class="list">`;
  for(let i=from;i<7;i++) for(const s of slots){const cur=S.plan.days[i][s];if(!cur)continue;
    h+=`<button class="lrow s-${s}" data-place="${i}|${s}"><span class="emo">${RECMAP[cur].emo}</span><span class="main"><span class="title">${cap(dateOf(i).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric"}))} · ${SLOTS[s].toLowerCase()}</span><span class="sub">À la place de : ${esc(RECMAP[cur].name)}</span></span>${ICON.chev}</button>`}
  showSheet(h+"</div></section></div>","");
}

/* ---------- Questionnaire ---------- */
let ob=null;
const OB_STEPS=["goal","toi","corps","job","seances","diet","exclus","repas","store","budget"];
function openOnboarding(edit,step){
  const p=S.profile;
  ob={i:step||0,edit:!!edit,d:p?JSON.parse(JSON.stringify(p)):{goal:null,prenom:"",sexe:null,age:"",taille:"",poids:"",job:null,seances:3,diet:null,exclus:[],repas:null,store:null,budget:40}};
  const el=$("#ob"); if(el.hidden&&edit) history.pushState({ob:1},"");
  el.hidden=false;document.body.style.overflow="hidden";obRender();
}
function closeOnboarding(){$("#ob").hidden=true;document.body.style.overflow="";ob=null}
function obValid(){const d=ob.d;switch(OB_STEPS[ob.i]){
  case"goal":return!!d.goal;case"toi":return!!d.sexe&&d.age>=14&&d.age<=99;
  case"corps":return d.taille>=130&&d.taille<=230&&+String(d.poids).replace(",",".")>=35&&+String(d.poids).replace(",",".")<=250;
  case"job":return!!d.job;case"diet":return!!d.diet;case"repas":return!!d.repas;case"store":return!!d.store;default:return true}}
function opt(key,val,label,emo,sub){return `<button class="opt" data-ob="${key}" data-v="${val}" aria-pressed="${ob.d[key]==val}"><span class="emo">${emo}</span><span><b>${label}</b>${sub?`<small>${sub}</small>`:""}</span></button>`}
function budgetLine(d){const n=d.repas===4?28:21;return `Pour toi seul, ${n} repas · ${eur(d.budget/n)} le repas`}
function obRender(){
  const d=ob.d, step=OB_STEPS[ob.i], n=OB_STEPS.length;
  let q="",body="";
  switch(step){
    case"goal":q="Quel est ton objectif ?";body=`<div class="opts">${Object.entries(GOALS).map(([k,v])=>opt("goal",k,v[0],v[1],v[2])).join("")}</div>`;break;
    case"toi":q="Parle-nous de toi";body=`<label class="lbl">Prénom<input class="field" data-in="prenom" value="${esc(d.prenom)}" autocomplete="given-name" placeholder="Facultatif"></label>
      <div class="grid2">${opt("sexe","h","Homme","👨")}${opt("sexe","f","Femme","👩")}</div>
      <label class="lbl">Âge<input class="field" data-in="age" type="number" inputmode="numeric" value="${esc(d.age)}" placeholder="ans"></label>
      <p class="small muted">Le sexe et l'âge servent au calcul de ton métabolisme de base.</p>`;break;
    case"corps":q="Tes mensurations";body=`<label class="lbl">Taille (cm)<input class="field" data-in="taille" type="number" inputmode="numeric" value="${esc(d.taille)}"></label><label class="lbl">Poids (kg)<input class="field" data-in="poids" type="text" inputmode="decimal" value="${esc(String(d.poids).replace(".",","))}"></label>`;break;
    case"job":q="Au travail, tu es plutôt…";body=`<div class="opts">${Object.entries(JOBS).map(([k,v])=>opt("job",k,v[0],v[1])).join("")}</div>`;break;
    case"seances":q="Combien de séances de sport par semaine ?";body=`<div class="stepper"><button data-sea="-1" aria-label="Moins">−</button><span class="big">${d.seances}</span><button data-sea="1" aria-label="Plus">+</button></div><p class="muted" style="text-align:center">${d.seances===0?"Pas de sport pour l'instant":d.seances+" séance"+(d.seances>1?"s":"")+" de 45 à 60 min"}</p>`;break;
    case"diet":q="Ton régime alimentaire";body=`<div class="opts">${Object.entries(DIETS).map(([k,v])=>opt("diet",k,v[0],v[1])).join("")}</div>`;break;
    case"exclus":q="Des aliments à éviter ?";body=`<p class="muted">Touche ceux que tu ne veux pas voir dans tes repas.</p><div class="chipset">${EXCLUDABLE.map(i=>`<button class="chip" data-ex="${i}" aria-pressed="${d.exclus.includes(i)}">${esc(ing(i).name)}</button>`).join("")}</div>`;break;
    case"repas":q="Combien de repas par jour ?";body=`<div class="opts">${opt("repas",3,"3 repas","🍽️","Petit-déj, déjeuner, dîner")}${opt("repas",4,"3 repas + collation","🍌","Pratique autour des séances")}</div>`;break;
    case"store":q="Où fais-tu tes courses ?";body=`<div class="grid2">${Object.entries(STORES).map(([k,v])=>`<button class="opt" data-ob="store" data-v="${k}" aria-pressed="${d.store===k}"><b>${v[0]}</b></button>`).join("")}</div>`;break;
    case"budget":q="Ton budget courses par semaine";body=`<div class="big" id="bval">${d.budget} €</div><input type="range" min="20" max="150" step="5" value="${d.budget}" data-budget aria-label="Budget"><p class="muted" style="text-align:center" id="bline">${budgetLine(d)}</p>`;break;
  }
  const last=ob.i===n-1, label=ob.edit?"Enregistrer":last?"Calculer mon plan":"Continuer";
  $("#ob").innerHTML=`<div class="wrap"><div class="obtop">${ob.i>0||ob.edit?`<button class="iconbtn" data-obnav="back" aria-label="${ob.edit?"Annuler":"Retour"}">${ob.edit?ICON.close:ICON.back}</button>`:""}${ob.edit?`<span class="eyebrow" style="flex:1">Modifier</span>`:`<div class="prog"><i style="width:${(ob.i+1)/n*100}%"></i></div><span class="small muted num">${String(ob.i+1).padStart(2,"0")} / ${n}</span>`}</div>
  ${ob.i===0&&!ob.edit?`<p class="eyebrow">À table, ton plan de repas sportifs</p>`:""}<h1>${q}</h1>${body}
  <div class="obfoot"><button class="btn primary block" data-obnav="next" ${obValid()?"":"disabled"}>${label}</button></div></div>`;
}
function obFinish(){
  const d=ob.d;d.age=+d.age;d.taille=+d.taille;d.poids=+String(d.poids).replace(",",".");d.repas=+d.repas;
  const old=S.profile, edit=ob.edit;
  S.profile=d;cache.clear();
  if(edit&&S.plan){
    const regen=old.diet!==d.diet||old.repas!==d.repas||JSON.stringify([...old.exclus].sort())!==JSON.stringify([...d.exclus].sort());
    if(regen){S.plan=generate();S.eaten={};toast("Profil mis à jour · nouvelle semaine générée")}
    else{ if(old.budget!==d.budget||old.store!==d.store) fitBudget(S.plan); toast("Profil mis à jour · portions recalculées") }
    save(); if(history.state&&history.state.ob) history.back(); closeOnboarding(); render(); return;
  }
  const t=targets();
  $("#ob").innerHTML=`<div class="wrap" style="justify-content:center"><h1>On prépare ton plan…</h1>
   <div class="ticks"><div><i>✓</i>Besoins : ${fmt(t.kcal)} kcal par jour</div><div><i>✓</i>Macros : P ${t.P} · G ${t.G} · L ${t.L} g</div><div><i>✓</i>Prix ${STORES[d.store][0]} appliqués</div><div><i>✓</i>Ta semaine de ${slotsList().length*7} repas</div></div>
   <div class="obfoot" hidden id="obgo"><button class="btn primary block" data-obnav="done">Voir ma semaine</button></div></div>`;
  S.plan=generate();S.eaten={};selDay=0;save();
  const ticks=[...document.querySelectorAll(".ticks div")];
  ticks.forEach((el,i)=>setTimeout(()=>el.classList.add("on"),300+i*450));
  setTimeout(()=>{const g=$("#obgo");if(g)g.hidden=false},300+ticks.length*450);
}

/* ---------- Open Prices (bêta) ---------- */
async function refreshOpenPrices(){
  const ids=Object.keys(ING).filter(id=>ing(id).off), st=storeId(), brand=STORES[st][0].toLowerCase().replace(/[^a-z]/g,"");
  toast("Recherche des prix…");
  let okN=0,missN=0,netErr=0;
  await Promise.all(ids.map(async id=>{
    try{
      const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);
      const res=await fetch("https://prices.openfoodfacts.org/api/v1/prices?category_tag="+encodeURIComponent(ing(id).off)+"&currency=EUR&order_by=-date&size=100",{signal:ctl.signal});
      clearTimeout(to);
      if(!res.ok) throw new Error(res.status);
      const data=await res.json(), items=(data.items||[]).filter(x=>x&&x.price>0&&x.price<60&&(!x.price_per||x.price_per==="KILOGRAM"));
      const fr=items.filter(x=>!x.location||!x.location.osm_address_country_code||x.location.osm_address_country_code==="FR");
      const mine=fr.filter(x=>x.location&&String(x.location.osm_brand||x.location.osm_name||"").toLowerCase().replace(/[^a-z]/g,"").includes(brand));
      const med=a=>{const v=a.map(x=>+x.price).sort((p,q)=>p-q);return v[Math.floor(v.length/2)]};
      if(mine.length>=3){S.op[id]={v:med(mine),n:mine.length,store:st};okN++}
      else if(fr.length>=3){S.op[id]={v:med(fr),n:fr.length};okN++}
      else missN++;
    }catch(e){netErr++}
  }));
  save();cache.clear();render();
  toast(netErr===ids.length?"Open Prices injoignable depuis cet appareil":okN+" prix mis à jour"+(missN?" · "+missN+" sans relevés":""));
}

/* ---------- Événements ---------- */
document.addEventListener("click",e=>{
  const li=e.target.closest(".steps li"); if(li){li.classList.toggle("done");return}
  if(e.target.id==="scrim") return closeSheet();
  const b=e.target.closest("button"); if(!b) return;
  const D=b.dataset;
  if(D.tab){ if(D.tab===tab&&tab==="jour"&&planOn()) selDay=dayIndex(); if(D.tab===tab){window.scrollTo({top:0,behavior:"smooth"});if(tab!=="jour")return} return go(D.tab)}
  if(D.selday!=null) return setDay(+D.selday);
  if(D.goday!=null){selDay=+D.goday;scrollPos.jour=0;return go("jour")}
  if(D.eat){const k=D.eat;if(S.eaten[k])delete S.eaten[k];else S.eaten[k]=1;save();
    if(navigator.vibrate) navigator.vibrate(8);
    if(D.sheet){ if(S.eaten[k]) {toast("Bon appétit !");closeSheet()} else openSheet(sheetCtx.rid,sheetCtx.slot,sheetCtx.day) } else render(); return}
  if(D.open) return openSheet(D.open,D.slot,D.day);
  if(D.pick){const {slot,day}=sheetCtx;S.plan.days[day][slot]=D.pick;delete S.eaten[eatKey(day,slot)];save();
    openSheet(D.pick,slot,day);toast("Repas remplacé");return}
  if(D.place){const [d,s]=D.place.split("|");S.plan.days[+d][s]=sheetCtx.rid;delete S.eaten[eatKey(+d,s)];save();
    selDay=+d;toast("Ajouté au menu du "+dateOf(+d).toLocaleDateString("fr-FR",{weekday:"long"}));closeSheet();if(tab!=="jour")go("jour");return}
  if(D.f){recFilter=D.f;document.querySelectorAll("[data-f]").forEach(c=>c.setAttribute("aria-pressed",c.dataset.f===recFilter));$("#rgrid").innerHTML=recGrid();return}
  if(D.scope){shopScope=D.scope;return render()}
  if(D.editstep!=null) return openOnboarding(true,+D.editstep);
  if(D.ex){const a=ob.d.exclus,i=a.indexOf(D.ex);if(i>=0)a.splice(i,1);else a.push(D.ex);b.setAttribute("aria-pressed",i<0);return}
  if(D.ob){ob.d[D.ob]=D.ob==="repas"?+D.v:D.v;
    if(!ob.edit&&["goal","job","diet","repas","store"].includes(D.ob)){obRender();setTimeout(()=>{if(ob&&obValid()&&OB_STEPS[ob.i]===D.ob){ob.i++;obRender()}},220);return}
    return obRender()}
  if(D.sea){ob.d.seances=Math.min(7,Math.max(0,ob.d.seances+ +D.sea));return obRender()}
  if(D.obnav){const nv=D.obnav;
    if(nv==="back"){if(ob.edit){if(history.state&&history.state.ob)history.back();closeOnboarding();return}if(ob.i===0)return;ob.i--;return obRender()}
    if(nv==="next"){if(!obValid())return;if(ob.edit||ob.i===OB_STEPS.length-1)return obFinish();ob.i++;$("#ob").scrollTop=0;return obRender()}
    if(nv==="done"){closeOnboarding();selDay=0;go("jour");return}}
  if(D.act){switch(D.act){
    case"close":return closeSheet();
    case"back":return openSheet(sheetCtx.rid,sheetCtx.slot,sheetCtx.day);
    case"swap":return openSwap();
    case"place":return openPlace();
    case"regen":if(planOn()&&!confirm("Remplacer la semaine en cours par une nouvelle ?"))return;
      S.plan=generate();S.eaten={};selDay=0;save();render();toast("Nouvelle semaine générée");return;
    case"copy":{const items=shopItems(),done=S.shop[S.plan.start]||{};let txt="Courses "+STORES[storeId()][0]+"\n";
      for(const ry of RAYON_ORDER){const g=items.filter(x=>ing(x.i).ray===ry&&!done[x.i]);if(!g.length)continue;txt+="\n"+RAYONS[ry]+"\n";g.forEach(x=>txt+="- "+ing(x.i).name+" : "+qtyLabel({i:x.i,g:x.g},true)+"\n")}
      if(navigator.share&&/iPhone|iPad|Android/i.test(navigator.userAgent)){navigator.share({title:"Liste de courses",text:txt}).catch(()=>{});return}
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Liste copiée"),()=>toast("Copie impossible sur cet appareil"));return}
    case"resetprices":delete S.prices[storeId()];S.op={};save();cache.clear();render();toast("Prix réinitialisés");return;
    case"openprices":return refreshOpenPrices();
  }}
});
window.addEventListener("popstate",()=>{
  if(!$("#sheet").hidden) return hideSheet();
  if(ob&&ob.edit) return closeOnboarding();
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.in!=null){ob.d[t.dataset.in]=t.value;const btn=document.querySelector('[data-obnav="next"]');if(btn)btn.disabled=!obValid()}
  if(t.dataset.budget!=null){ob.d.budget=+t.value;$("#bval").textContent=t.value+" €";$("#bline").textContent=budgetLine(ob.d)}
  if(t.dataset.q!=null){recQuery=t.value;$("#rgrid").innerHTML=recGrid()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.shop){const k=S.plan.start;S.shop[k]=S.shop[k]||{};if(t.checked)S.shop[k][t.dataset.shop]=1;else delete S.shop[k][t.dataset.shop];save();
    const y=window.scrollY;render();window.scrollTo(0,y)}
  if(t.dataset.hide!=null){hideDone=t.checked;render()}
  if(t.dataset.price){const v=parseFloat(t.value.replace(",","."));const st=storeId();S.prices[st]=S.prices[st]||{};
    if(v>0)S.prices[st][t.dataset.price]=Math.round(v*100)/100;else delete S.prices[st][t.dataset.price];save();cache.clear();
    const y=window.scrollY;render();const det=document.querySelector("details.prices");if(det)det.open=true;window.scrollTo(0,y);toast("Prix enregistré")}
});
/* glisser : jours (vue Repas) et fermeture de la fiche (vers le bas depuis l'en-tête) */
let touch=null;
document.addEventListener("touchstart",e=>{const p=e.touches[0];touch={x:p.clientX,y:p.clientY,t:Date.now(),zone:e.target.closest(".swipe")?"day":e.target.closest(".sheethead")?"sheet":null}},{passive:true});
document.addEventListener("touchend",e=>{
  if(!touch||!touch.zone) return; const p=e.changedTouches[0], dx=p.clientX-touch.x, dy=p.clientY-touch.y, fast=Date.now()-touch.t<600;
  if(touch.zone==="day"&&tab==="jour"&&fast&&Math.abs(dx)>60&&Math.abs(dy)<45) setDay(selDay+(dx<0?1:-1),dx<0?"r":"l");
  if(touch.zone==="sheet"&&dy>70&&Math.abs(dx)<60) closeSheet();
  touch=null;
},{passive:true});

if(S.plan){const di=dayIndex();selDay=di>=0&&di<=6?di:0}
history.replaceState({},"");
go("jour");
</script>
